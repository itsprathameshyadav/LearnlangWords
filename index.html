<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LearnLangWords</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <div class="container">

        <header>
            <h1>LearnLangWords</h1>
            <p>Build your vocabulary, one word at a time.</p>
        </header>


        <section class="settings-card">

            <h2>Settings</h2>

            <div class="form-grid">

                <div class="form-group">
                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >
                </div>


                <div class="form-group">
                    <label for="language">
                        Learn
                    </label>

                    <select id="language">

                        <option value="English">
                            English
                        </option>

                        <option value="Hindi">
                            Hindi
                        </option>

                        <option value="Spanish">
                            Spanish
                        </option>

                        <option value="French">
                            French
                        </option>

                        <option value="German">
                            German
                        </option>

                        <option value="Italian">
                            Italian
                        </option>

                        <option value="Portuguese">
                            Portuguese
                        </option>

                        <option value="Japanese">
                            Japanese
                        </option>

                    </select>
                </div>


                <div class="form-group">
                    <label for="learn-in">
                        Learn in
                    </label>

                    <select id="learn-in">

                        <option value="English">
                            English
                        </option>

                        <option value="Hindi">
                            Hindi
                        </option>

                        <option value="Spanish">
                            Spanish
                        </option>

                        <option value="French">
                            French
                        </option>

                        <option value="German">
                            German
                        </option>

                        <option value="Italian">
                            Italian
                        </option>

                        <option value="Portuguese">
                            Portuguese
                        </option>

                        <option value="Japanese">
                            Japanese
                        </option>

                    </select>
                </div>


                <div class="form-group">
                    <label for="words-per-day">
                        Words per day
                    </label>

                    <select id="words-per-day">

                        <option value="1">
                            1
                        </option>

                        <option value="2">
                            2
                        </option>

                        <option value="3">
                            3
                        </option>

                        <option value="5">
                            5
                        </option>

                        <option value="10">
                            10
                        </option>

                    </select>
                </div>

            </div>


            <button id="save-settings">
                Save Settings
            </button>

            <p id="status-message"></p>

        </section>


        <section class="stats">

            <div class="stat-card">
                <h3>Words Learned</h3>
                <p id="words-learned">0</p>
            </div>

            <div class="stat-card">
                <h3>Words Today</h3>
                <p id="words-today">0</p>
            </div>

            <div class="stat-card">
                <h3>Last Run</h3>
                <p id="last-run">Never</p>
            </div>

        </section>


        <section class="vocabulary-section">

            <h2>Today's Vocabulary</h2>

            <div id="today-vocabulary">
                <p class="empty-message">
                    No vocabulary available yet.
                </p>
            </div>

        </section>


        <section class="vocabulary-section">

            <h2>Previous Vocabulary</h2>

            <div id="previous-vocabulary">
                <p class="empty-message">
                    No previous vocabulary available.
                </p>
            </div>

        </section>

    </div>


    <script src="script.js"></script>

</body>

</html>
